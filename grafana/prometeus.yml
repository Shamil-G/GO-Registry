global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'go_sso'
    static_configs:
      - targets: ['192.168.1.34:8825']
        labels:
          service: 'sso'
          env: 'prod'

  - job_name: 'registry'
    static_configs:
      - targets: ['192.168.1.34:80']
        labels:
          service: 'registry'
          env: 'prod'

  # GO-Court. Метрики и их метки совпадают с registry один в один (оба проекта
  # из одного шаблона metrics/), поэтому обе системы ложатся на общий дашборд
  # grafana/all-services-grafana.json — различает их метка service.
  #
  # Цель — внешний адрес за nginx: сам сервис слушает 127.0.0.1:5152 и снаружи
  # недоступен. Если nginx не проксирует /metrics для этого адреса, добавить
  # ему location — либо, если Prometheus стоит на той же машине, поменять цель
  # на 127.0.0.1:5152.
  - job_name: 'go_court'
    static_configs:
      - targets: ['192.168.1.34:8180']
        labels:
          service: 'court'
          env: 'prod'

