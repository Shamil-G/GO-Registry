# Диагностика адреса клиента. log_format живёт в контексте http — файлы из
# sites-enabled/conf.d включаются именно туда, поэтому его можно держать здесь,
# вне server {}. Имя должно быть уникальным среди всех конфигов nginx.
#   peer — кто подключился к nginx (корпоративный прокси или сама рабочая станция)
#   xff  — X-Forwarded-For, пришедший В nginx; в Go уйдёт "<xff>, <peer>"
# Когда убедитесь, что ключи правильные, строку access_log ... registry_ip можно убрать.
log_format registry_ip '$time_local peer=$remote_addr xff="$http_x_forwarded_for" '
                       '"$request" $status';

server {
    #listen 8085;
    listen 80;
    server_name wuar 192.168.1.34;
    #add_header Access-Control-Allow-Origin *;

    gzip on;
    client_max_body_size 10M;
    gzip_vary on;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_min_length 512;
    gzip_types text/plain text/xml text/javascript text/css font/ttf
               application/xml application/json application/manifest+json application/javascript
               application/rdf+xml application/rss+xml;

    access_log /var/log/nginx/nginx-go-registry-access.log;
    access_log /var/log/nginx/nginx-go-registry-ip.log registry_ip;
    error_log /var/log/nginx/nginx-go-registry-error.log;

    # КЛЮЧ СЕССИИ SSO — X-Forwarded-For (см. middleware/client_ip.go).
    #
    # В каждом location должно быть ровно одно
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Это «что пришло в nginx» + ", " + $remote_addr:
    #     рабочая станция → nginx                   "192.168.5.236"
    #     рабочая станция → прокси 192.168.1.12 → nginx  "192.168.5.236, 192.168.1.12"
    #
    # НЕЛЬЗЯ:
    #   - менять на $remote_addr — все пользователи прокси получат один ключ;
    #   - дублировать строку или подставлять $http_host (инцидент 25.08.2026);
    #   - включать realip (set_real_ip_from / real_ip_header): он подменяет
    #     $remote_addr, цепочка становится "192.168.5.236, 192.168.5.236",
    #     и адрес прокси из ключа пропадает.
    # X-Real-IP Go использует только как аварийный путь.

    # Умная обработка PDF-файлов
    # Временный принудительный сброс кэша для справочника
    location = /static/nsi/PhoneRefer.pdf {
	# Если метка уже есть, проксируем запрос в Go как обычно
	proxy_pass http://localhost:9001;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

	expires epoch;
	add_header Cache-Control "no-cache, must-revalidate";
    }

    # Стандартная локация для всех остальных запросов
    location / {
    proxy_pass http://localhost:9001;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #proxy_set_header Host $proxy_host;
    }

}
